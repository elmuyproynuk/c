name: Build Claude's Mod Menu

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Phone-friendly: if you uploaded the project as a .zip in the repo root, unpack it here.
      - name: Unpack uploaded zip (if any)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'EOF'
          import glob, zipfile
          for z in glob.glob('*.zip'):
              print('Unpacking', z)
              zipfile.ZipFile(z).extractall('.')
          EOF

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: nightly
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
